# Checks every push to main and every pull request: lint, formatting, types and tests.
# Database tests and data checks need PostgreSQL and the local data/raw files, so they stay
# manual (AGENTS.md, section 6).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Placeholders for the required settings: the API tests use SQLite, and the PostgreSQL
      # tests are skipped without BC_RUN_DB_TESTS. No SEC_USER_AGENT, so nothing can call SEC.
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Tests
        run: python -m unittest discover tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test -- --watch=false
