<app-sidebar class="desktop-sidebar" />

<div class="main-content">
  <app-topbar [menuOpen]="menuOpen()" (menuRequested)="openMenu($event)" />
  <main>
    <router-outlet />
  </main>
</div>

<dialog
  #mobileMenu
  id="mobile-navigation"
  class="mobile-menu"
  aria-label="Navigation menu"
  (click)="onBackdropClick($event)"
  (cancel)="onMenuCancel($event)"
  (close)="onMenuClosed()"
>
  <app-sidebar (navigated)="closeMenu()">
    <div class="menu-top">
      <button class="menu-close" type="button" autofocus (click)="closeMenu()">
        Close menu <app-icon class="menu-close-icon" name="close" />
      </button>
    </div>
  </app-sidebar>
</dialog>
