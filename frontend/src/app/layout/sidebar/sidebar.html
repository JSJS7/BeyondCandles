<aside class="sidebar">
  <!-- The masthead of the paper: the name alone, in a display serif. -->
  <div class="brand">BeyondCandles</div>

  <!-- The mobile menu puts its close button here, under the name. -->
  <ng-content />

  <nav class="navigation">
    <a
      class="nav-item"
      routerLink="/screener"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      (click)="navigated.emit()"
    >
      <app-icon class="nav-icon" name="filter" />
      <span>Screener</span>
    </a>

    <a
      class="nav-item"
      routerLink="/backtest"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      (click)="navigated.emit()"
    >
      <app-icon class="nav-icon" name="history" />
      <span>Backtest</span>
    </a>
  </nav>
</aside>
